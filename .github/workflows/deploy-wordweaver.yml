name: Build and deploy Wordweaver to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Check out the public Wordweaver source
        uses: actions/checkout@v4
        with:
          repository: jessicacarter9955/quizzio
          ref: wordweaver-pattern-favorites-difficulty
          path: source
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Resolve dependencies
        working-directory: source
        run: flutter pub get

      - name: Analyze Flutter
        working-directory: source
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
        continue-on-error: true

      - name: Run Flutter tests
        working-directory: source
        run: flutter test
        continue-on-error: true

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build web release
        working-directory: source
        run: flutter build web --release --base-href /language/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: source/build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
